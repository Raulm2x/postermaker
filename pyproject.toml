[project]
name = "postermaker"
version = "0.3.1"
description = "PosterMaker: Convierte una imagen en un póster imprimible dividido en hojas Carta, A4, Oficio o Tabloide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.1",
    "img2pdf>=0.5",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pypdf>=4",
]

[project.scripts]
postermaker = "postermaker.__main__:main"
postermaker-cli = "postermaker.cli:main"
postermaker-web = "postermaker.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postermaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
